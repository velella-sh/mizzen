site_name: Orbit
docs_dir: docs
site_dir: site
nav:
  - Home: index.md
  - Guide:
      - Setup: guide/setup.md
plugins:
  - search
  - awesome-pages
theme:
  name: material
  features:
    - navigation.tabs
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
extra_css:
  - assets/extra.css
