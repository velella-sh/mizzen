name: publish-next

# Publishes a pre-release such as 0.3.0-next.0 of @velella/mizzen under the `next` dist-tag whenever the frozen
# data contract changes on main, so a theme can typecheck against it before 0.3.0 ships.
#
#   - It never touches `latest`: the dist-tag is fixed to `next` below, and `npm publish --tag next` is the only
#     publish command. The pre-release promises the contract types only, not the behaviour.
#   - It runs in CI only, with npm trusted publishing and provenance; nothing is published from a local machine.
#   - package.json is not changed in the repository. The runner stamps `<base>-next.<n>` on its own copy, where
#     <n> is the first index not yet on npm, so a re-run after a failure picks up where it stopped.
#
# One-time setup on npmjs.com is in CONTRIBUTING.md ("Pre-releases").
on:
  push:
    branches: [main]
    paths:
      - src/contracts/**
      - test/data-contract-freeze.test.ts
      - .github/workflows/publish-next.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-next
  cancel-in-progress: false

env:
  # The release the pre-releases lead up to. Raise it when the next minor starts.
  NEXT_BASE: 0.3.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Choose the next pre-release version
        id: meta
        working-directory: mizzen
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          versions="$(npm view "$name" versions --json 2>/dev/null || echo '[]')"
          n="$(NAME_VERSIONS="$versions" node -e '
            const raw = JSON.parse(process.env.NAME_VERSIONS || "[]");
            const all = Array.isArray(raw) ? raw : [raw];
            const prefix = process.env.NEXT_BASE + "-next.";
            const used = all.filter((v) => v.startsWith(prefix)).map((v) => Number(v.slice(prefix.length)));
            console.log(used.length ? Math.max(...used) + 1 : 0);
          ')"
          version="$NEXT_BASE-next.$n"
          npm version "$version" --no-git-tag-version --allow-same-version >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $name@$version to the \`next\` dist-tag" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Test
        run: npm test
        working-directory: mizzen
      - name: Type check
        run: npm run typecheck
        working-directory: mizzen
      - name: Install the tarball and import the data contract types
        run: scripts/smoke-package.sh ../mizzen ../lateen
        working-directory: mizzen
      - name: Pack the tarball
        working-directory: mizzen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --silent --pack-destination "$RUNNER_TEMP/dist" >/dev/null
          ls -l "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@velella/mizzen/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist
      - name: Publish under next with provenance
        run: |
          set -euo pipefail
          npm install --global --silent npm@^11.5.1
          npm publish "$RUNNER_TEMP"/dist/*.tgz --access public --provenance --tag next
          echo "Published ${{ needs.verify.outputs.version }} to \`next\`; \`latest\` is untouched" >> "$GITHUB_STEP_SUMMARY"
