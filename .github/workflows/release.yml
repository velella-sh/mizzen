name: release

# Publishes @velella/mizzen to npm whenever a release tag is pushed or a GitHub Release is published.
#
#   1. verify  checks the tag, tests the exact commit, and packs ONE tarball.
#   2. publish uploads that same tarball to npm with provenance. It holds the only credential in the
#      workflow (an OIDC token) and never runs repository scripts.
#
# There is no npm token anywhere: npm trusted publishing exchanges the job's OIDC identity for a short-lived
# publish credential. One-time setup on npmjs.com is in CONTRIBUTING.md ("Releasing").
#
# A release whose version has a prerelease suffix (0.4.0-rc.1) goes to the `next` dist-tag; any other goes to
# `latest`. To retry a failed publish, run this workflow by hand with the tag; an already-published
# version is skipped, so a retry is safe.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v0.3.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
      published: ${{ steps.meta.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: mizzen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          ref: main
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mizzen/package-lock.json
            lateen/package-lock.json
      - name: Check the tag and choose the dist-tag
        id: meta
        working-directory: mizzen
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version before releasing."
            exit 1
          fi
          # Releases come from main only: the tagged commit must be reachable from it.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Merge the release commit first."
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          published=false
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            published=true
          fi
          {
            echo "version=$version"
            echo "dist-tag=$dist_tag"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version to the \`$dist_tag\` dist-tag (already on npm: $published)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install both repositories
        if: steps.meta.outputs.published != 'true'
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Test with the coverage gate
        if: steps.meta.outputs.published != 'true'
        run: npm run test:coverage
        working-directory: mizzen
      - name: Type check
        if: steps.meta.outputs.published != 'true'
        run: npm run typecheck
        working-directory: mizzen
      - name: Build the packages and install them
        if: steps.meta.outputs.published != 'true'
        run: scripts/smoke-package.sh ../mizzen ../lateen
        working-directory: mizzen
      - name: Pack the tarball
        if: steps.meta.outputs.published != 'true'
        working-directory: mizzen
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --silent --pack-destination "$RUNNER_TEMP/dist" >/dev/null
          ls -l "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.published != 'true'
        with:
          name: package
          path: ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  performance:
    permissions:
      contents: read
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

  publish:
    needs: [verify, performance]
    if: needs.verify.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `npm` environment is what the npm trusted publisher is bound to. Add required reviewers to it
    # in the repository settings to gate every release behind a manual approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@velella/mizzen/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist
      - name: Publish with provenance
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          set -euo pipefail
          npm install --global --silent npm@^11.5.1
          npm publish "$RUNNER_TEMP"/dist/*.tgz --access public --provenance --tag "$DIST_TAG"
          echo "Published ${{ needs.verify.outputs.version }} to \`$DIST_TAG\`" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.verify.outputs.published == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          args=()
          if [ "$DIST_TAG" = next ]; then args+=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --title "Mizzen $VERSION" --generate-notes "${args[@]}"
