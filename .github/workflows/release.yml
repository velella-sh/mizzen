name: release

# Publishes @velella/mizzen to npm whenever a release tag is pushed or a GitHub Release is published.
#
#   1. verify  checks the tag, tests the exact commit, and packs ONE tarball.
#   2. publish uploads that same tarball to npm with provenance. It holds the only credential in the
#      workflow (an OIDC token) and never runs repository scripts.
#
# There is no npm token anywhere: npm trusted publishing exchanges the job's OIDC identity for a short-lived
# publish credential. One-time setup on npmjs.com is in CONTRIBUTING.md ("Releasing").
#
# A release whose version has a prerelease suffix (0.4.0-rc.1) goes to the `next` dist-tag; any other goes to
# `latest`. To retry a failed publish, run this workflow by hand with the tag; an already-published
# version is skipped, so a retry is safe.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, such as v0.3.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  # The published theme this release is verified with. Bump it when the theme ships a matching release; a moving
  # main branch could hide an engine regression behind a simultaneous theme change.
  LATEEN_VERSION: "0.2.3"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dist-tag: ${{ steps.meta.outputs.dist-tag }}
      published: ${{ steps.meta.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: mizzen
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          ref: v${{ env.LATEEN_VERSION }}
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mizzen/package-lock.json
            lateen/package-lock.json
      - name: Check the tag and choose the dist-tag
        id: meta
        working-directory: mizzen
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version before releasing."
            exit 1
          fi
          # Releases come from main only: the tagged commit must be reachable from it.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main. Merge the release commit first."
            exit 1
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          published=false
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            published=true
          fi
          {
            echo "version=$version"
            echo "dist-tag=$dist_tag"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $name@$version to the \`$dist_tag\` dist-tag (already on npm: $published)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install both repositories
        if: steps.meta.outputs.published != 'true'
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund)
      - name: Test with the coverage gate
        if: steps.meta.outputs.published != 'true'
        run: npm run test:coverage
        working-directory: mizzen
      - name: Type check
        if: steps.meta.outputs.published != 'true'
        run: npm run typecheck
        working-directory: mizzen
      - name: Pack the one release tarball and the pinned theme
        if: steps.meta.outputs.published != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dist" "$RUNNER_TEMP/theme" "$RUNNER_TEMP/release-evidence"
          mkdir -p "$RUNNER_TEMP/dist" "$RUNNER_TEMP/theme" "$RUNNER_TEMP/release-evidence"
          (cd mizzen && npm pack --silent --pack-destination "$RUNNER_TEMP/dist" >/dev/null)
          (cd lateen && npm pack --silent --pack-destination "$RUNNER_TEMP/theme" >/dev/null)
          (cd "$RUNNER_TEMP/dist" && sha256sum ./*.tgz > SHA256SUMS && cat SHA256SUMS)
          echo "theme @velella/lateen@$LATEEN_VERSION: $(cd "$RUNNER_TEMP/theme" && sha256sum ./*.tgz)" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the release tarball
        if: steps.meta.outputs.published != 'true'
        working-directory: mizzen
        run: >-
          scripts/smoke-package.sh ../mizzen ../lateen
          --mizzen-tarball "$RUNNER_TEMP"/dist/velella-mizzen-*.tgz
          --lateen-tarball "$RUNNER_TEMP"/theme/velella-lateen-*.tgz
      - name: Compare with the published 0.2.5 package and 0.2.3 theme
        if: steps.meta.outputs.published != 'true'
        working-directory: mizzen
        run: >-
          node scripts/release-compat.ts
          --candidate "$RUNNER_TEMP"/dist/velella-mizzen-*.tgz
          --theme "$RUNNER_TEMP"/theme/velella-lateen-*.tgz
          --report "$RUNNER_TEMP"/release-evidence/compat-report.json
      - name: Install the tested tarball in a clean project
        if: steps.meta.outputs.published != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acceptance"
          cd "$RUNNER_TEMP/acceptance"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/dist/velella-mizzen-*.tgz
      - name: Run the release acceptance cases from the tarball
        if: steps.meta.outputs.published != 'true'
        working-directory: mizzen
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/dist/velella-mizzen-*.tgz)"
          digest="$(sha256sum "$tarball" | cut -d' ' -f1)"
          node scripts/acceptance.ts \
            --mizzen "$RUNNER_TEMP/acceptance/node_modules/.bin/mizzen" \
            --release --candidate "$GITHUB_SHA" --digest "$digest" --tarball "$tarball" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.published != 'true'
        with:
          name: package
          path: |
            ${{ runner.temp }}/dist/*.tgz
            ${{ runner.temp }}/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.published != 'true'
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence/compat-report.json
          if-no-files-found: error
          retention-days: 90

  performance:
    permissions:
      contents: read
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

  publish:
    needs: [verify, performance]
    if: needs.verify.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `npm` environment is what the npm trusted publisher is bound to. Add required reviewers to it
    # in the repository settings to gate every release behind a manual approval.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@velella/mizzen/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and the provenance attestation
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist
      - name: Verify and publish the tested tarball with provenance
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          npm install --global --silent npm@^11.5.1
          npm publish ./*.tgz --access public --provenance --tag "$DIST_TAG"
          echo "Published ${{ needs.verify.outputs.version }} to \`$DIST_TAG\` from $(cat SHA256SUMS)" >> "$GITHUB_STEP_SUMMARY"

  # Installs the exact version npm now serves and runs the shipped cases again. A failure fails the release run, so
  # the release epic stays open until a post-publish run passes.
  acceptance-published:
    needs: [verify, publish]
    if: needs.verify.outputs.published != 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install the published version from npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "@velella/mizzen@$VERSION"
          npm pack "@velella/mizzen@$VERSION" --pack-destination "$RUNNER_TEMP/published" >/dev/null
      - name: Run the shipped cases against the npm package
        run: |
          set -euo pipefail
          tarball="$(ls "$RUNNER_TEMP"/published/velella-mizzen-*.tgz)"
          digest="$(sha256sum "$tarball" | cut -d' ' -f1)"
          node scripts/acceptance.ts \
            --mizzen "$RUNNER_TEMP/published/node_modules/.bin/mizzen" \
            --release --candidate "$GITHUB_SHA" --digest "$digest" --tarball "$tarball" \
            --summary "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [verify, publish]
    if: always() && needs.verify.result == 'success' && (needs.verify.outputs.published == 'true' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          args=()
          if [ "$DIST_TAG" = next ]; then args+=(--prerelease --latest=false); fi
          gh release create "$TAG" --verify-tag --title "Mizzen $VERSION" --generate-notes "${args[@]}"
