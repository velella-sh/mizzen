name: live agent evals

# Opt-in only: a live model call costs money and is not deterministic, so CI never runs it.
# Start it by hand, or set the repository variable MIZZEN_EVAL_LIVE=1 to allow the weekly schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || vars.MIZZEN_EVAL_LIVE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run the live adapter
        env:
          MIZZEN_EVAL_AGENT: ${{ secrets.MIZZEN_EVAL_AGENT }}
        run: node examples/evals/run.ts fixtures/evals live-report.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-eval-report
          path: live-report.json
          if-no-files-found: ignore
