name: ci

# Keep correctness checks independent of coverage and the scheduled data benchmark.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test test/boundary.test.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          ref: main
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mizzen/package-lock.json
            lateen/package-lock.json
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Test
        run: node --test --test-concurrency=4 --test-shard=${{ matrix.shard }}/2 "test/**/*.test.ts"
        working-directory: mizzen

  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run every shipped acceptance case through the public CLI
        run: node scripts/acceptance.ts --mizzen bin/mizzen.ts --candidate "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          ref: main
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mizzen/package-lock.json
            lateen/package-lock.json
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Check the docs site
        run: node bin/mizzen.ts check site
        working-directory: mizzen
      - name: Build the packages and install them
        run: scripts/smoke-package.sh ../mizzen ../lateen
        working-directory: mizzen

  # The social images must be the same bytes on every operating system (docs/adr/social-images.md). The render test holds
  # recorded hashes, so running it on all three is the proof. It needs neither Lateen nor a build.
  social-images:
    name: social images (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render the fixture images and compare their hashes
        run: node --test test/social-render.test.ts test/social-fonts.test.ts test/social-text.test.ts

  ci-required:
    if: always()
    needs: [static, test, acceptance, package, social-images]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every correctness check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'if (!Object.values(JSON.parse(process.env.RESULTS)).every(job => job.result === "success")) process.exit(1)'

  # Measures line coverage and publishes it for the README badge. It runs on main only and holds the
  # only write permission in this workflow: it can push the `badges` branch and nothing else. The badge
  # is a shields.io endpoint badge reading coverage.json from that branch, so the number follows main.
  coverage:
    name: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          ref: main
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mizzen/package-lock.json
            lateen/package-lock.json
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Measure coverage
        working-directory: mizzen
        run: |
          npm run test:coverage
          npm run coverage:badge
          echo "line coverage: $(node -p "require('./coverage/coverage.json').message")" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf badges
          git init --quiet badges
          cd badges
          git checkout --quiet -b badges
          cp "$GITHUB_WORKSPACE/mizzen/coverage/coverage.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): coverage for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
