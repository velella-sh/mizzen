name: ci

# Tests, type check, and a build of the packages as they install. Mizzen and Lateen test against each other, so both are checked out side by side.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Test
        run: npm test
        working-directory: mizzen
      - name: Type check
        run: npm run typecheck
        working-directory: mizzen
      - name: Build the packages and install them
        run: scripts/smoke-package.sh ../mizzen ../lateen
        working-directory: mizzen
      - name: Build the example data site twice from the packed tarballs
        run: scripts/smoke-example.sh ../mizzen ../lateen
        working-directory: mizzen

  # Builds a generated data site of 1,000 and 10,000 records and fails when a build is slower than, or uses more memory
  # than, bench/budget.json allows. The measurements are printed next to their budgets in the job summary.
  bench:
    name: data benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Run the benchmark against the budgets
        run: node scripts/bench-data.ts --check bench/budget.json > bench-data.json
        working-directory: mizzen
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-data
          path: mizzen/bench-data.json
          if-no-files-found: ignore

  # The social images must be the same bytes on every operating system (docs/adr/social-images.md). The render test holds
  # recorded hashes, so running it on all three is the proof. It needs neither Lateen nor a build.
  social-images:
    name: social images (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - name: Render the fixture images and compare their hashes
        run: node --test test/social-render.test.ts test/social-fonts.test.ts test/social-text.test.ts

  # Measures line coverage and publishes it for the README badge. It runs on main only and holds the
  # only write permission in this workflow: it can push the `badges` branch and nothing else. The badge
  # is a shields.io endpoint badge reading coverage.json from that branch, so the number follows main.
  coverage:
    name: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mizzen
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: velella-sh/lateen
          path: lateen
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install both repositories
        run: |
          set -euo pipefail
          (cd mizzen && npm ci --no-audit --no-fund && npm run build)
          (cd lateen && npm ci --no-audit --no-fund && npm install --no-audit --no-fund --no-save ../mizzen)
      - name: Measure coverage
        working-directory: mizzen
        run: |
          npm run test:coverage
          npm run coverage:badge
          echo "line coverage: $(node -p "require('./coverage/coverage.json').message")" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf badges
          git init --quiet badges
          cd badges
          git checkout --quiet -b badges
          cp "$GITHUB_WORKSPACE/mizzen/coverage/coverage.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore(badges): coverage for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
