# Copy to .github/workflows/data-impact-summary.yml.
#
# Comments on a pull request with what each changed record reaches: the record id, the kind and count of outputs
# (pages, lists, feeds, API files), and a link to the full JSON report, uploaded as a workflow artifact. One comment
# is kept up to date; it is found by the marker `<!-- mizzen-data-impact -->` and edited in place on every push. A
# record the pull request adds is summarized like one it edits; a removed record has no site model left to explain.
#
# `scripts/impact-summary.ts` is the script in the Mizzen repository: copy it into the site repository, or run this
# workflow from a checkout that has it. `jq` reads the changed records from `mizzen diff --format json`.
#
# Safe by construction: the job that builds the pull request's code has a read-only token and no secrets. It is the
# only job that runs anything from the pull request. The job that writes the comment has `pull-requests: write` but
# checks out nothing and runs nothing from the pull request: it posts a Markdown file as data. It does not run for
# pull requests from forks, whose token cannot write anyway.
#
# Change `SITE` to your site folder, and the Mizzen version to the one you use.
name: data-impact-summary

on:
  pull_request:

permissions: {}

concurrency:
  group: data-impact-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SITE: docs
  MIZZEN_VERSION: latest

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Mizzen and your theme
        run: npm install --no-save --no-audit --no-fund "@velella/mizzen@${MIZZEN_VERSION}"
      - name: Write the full report and the summary
        env:
          BASE_REF: origin/${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          npx mizzen diff --base "$BASE_REF" "$SITE" --format json > "$RUNNER_TEMP/data-impact.json"
          mkdir -p "$RUNNER_TEMP/impact"
          printf '<!-- mizzen-data-impact -->\n' > "$RUNNER_TEMP/data-impact.md"
          records=$(jq -r '.records[] | .collection as $collection | (.added[]?, .changed[]?) | "\($collection)/\(.id)"' "$RUNNER_TEMP/data-impact.json")
          if [ -z "$records" ]; then
            printf 'No data record changed.\n' >> "$RUNNER_TEMP/data-impact.md"
          else
            while IFS= read -r record; do
              node scripts/impact-summary.ts "$SITE" "$record" \
                --report "$RUNNER_TEMP/impact/${record//\//-}.json" \
                --link "$RUN_URL" >> "$RUNNER_TEMP/data-impact.md"
              printf '\n' >> "$RUNNER_TEMP/data-impact.md"
            done <<< "$records"
          fi
          cat "$RUNNER_TEMP/data-impact.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-impact
          path: |
            ${{ runner.temp }}/data-impact.md
            ${{ runner.temp }}/impact
          retention-days: 3

  comment:
    needs: report
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-impact
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | contains("<!-- mizzen-data-impact -->"))][0].id // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" --field body=@data-impact.md
          else
            gh api --method POST "repos/$REPO/issues/comments/$PR" --field body=@data-impact.md
          fi
