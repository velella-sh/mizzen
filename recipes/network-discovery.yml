# Copy to .github/workflows/network-discovery.yml in the organization site's repository.
#
# Builds the root site, then writes the sitemap index over its output. The index lists the root page sitemap and every
# public project's own sitemap from network.lock.json; robots.txt points at the index and keeps the build's other
# rules. Set the SITE_URL repository variable to the published domain, and SITE to the root site's folder.
name: network-discovery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: network-discovery
  cancel-in-progress: true

env:
  SITE: site
  SITE_URL: ${{ vars.SITE_URL || 'https://velella.sh' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Build the root site
        run: npx mizzen build "$SITE" --out dist
      - name: Write the sitemap index and robots.txt
        run: npx mizzen network sitemap "$SITE" --url "$SITE_URL" --out dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v5
